l carné se derivan al consultarlo.</text><text x="296.478" y="507.918" fill="#000" font-size="13" textLength="301.895">Registrar no reescribe dosis previas ni dispara</text><text x="296.478" y="523.051" fill="#000" font-size="13" textLength="206.883">aquí un envío de notificaciones.</text><rect x="56.339" y="486.434" width="214.139" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="66.339" y="507.572" fill="#000" font-size="12" textLength="194.139">Redirigir al carné de vacunación</text><rect x="641.269" y="377.781" width="218.193" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="651.269" y="398.92" fill="#000" font-size="12" textLength="198.193">Mostrar error seguro; no guardar</text><polygon points="456.887,537.117,468.887,549.117,456.887,561.117,444.887,549.117,456.887,537.117" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="869.462" y="342.172" width="116.855" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="879.462" y="363.311" fill="#000" font-size="12" textLength="96.855">Denegar acceso</text><polygon points="702.388,567.117,714.388,579.117,702.388,591.117,690.388,579.117,702.388,567.117" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="702.388" cy="622.117" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="702.388" cy="622.117" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="702.388" y1="72.297" x2="702.388" y2="92.297" style="stroke:#181818;stroke-width:1;"/><polygon points="698.388,82.297,702.388,92.297,706.388,82.297,702.388,86.297" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="702.388" y1="126.266" x2="702.388" y2="146.266" style="stroke:#181818;stroke-width:1;"/>